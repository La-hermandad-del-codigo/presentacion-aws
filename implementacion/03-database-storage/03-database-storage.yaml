AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SENATI - Proyecto Final AWS Fundamentals: APM Inversiones / RPsoft (Plataforma SOFI y Portales B2B)
  Fase 3: Capa de Base de Datos y Almacenamiento (Persistencia Relacional y Jerarquía de Storage).
  Provee 3 instancias dedicadas Amazon RDS PostgreSQL 16 (sofi_db, reflexo_db, arteideas_db) con AWS Secrets Manager,
  Amazon S3 con política de ciclo de vida (Standard -> Glacier Flexible), bloqueo de acceso público y TLS obligatorio,
  y Amazon EFS para almacenamiento compartido con Lifecycle IA, puntos de montaje Multi-AZ y Access Point /workspace.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Parámetros del Entorno e Integración (Fases 1 y 2)"
        Parameters:
          - EnvironmentName
      - Label:
          default: "2. Parámetros de Base de Datos (Amazon RDS PostgreSQL 16)"
        Parameters:
          - DBInstanceClass
          - DBAllocatedStorage
          - DBMaxAllocatedStorage
          - EnableMultiAZ
          - EnableEnhancedMonitoring
          - EnableDeletionProtection
      - Label:
          default: "3. Parámetros de Almacenamiento (Amazon S3 & Glacier)"
        Parameters:
          - S3BucketNamePrefix
          - DaysToStandardIA
          - DaysToGlacier
          - DaysToExpiration

Parameters:
  EnvironmentName:
    Type: String
    Default: apm-sofi-prod
    AllowedValues: [apm-sofi-prod, dev, staging]
    Description: Prefijo identificador del entorno. Debe coincidir con los stacks desplegados en Fase 1 y 2.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro]
    Description: Clase de cómputo para las 3 BDs (db.t3.micro para optimización de presupuesto).

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Capacidad inicial de disco SSD gp3 en GB para cada instancia PostgreSQL.

  DBMaxAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 500
    Description: Umbral máximo para Storage Autoscaling de RDS (previene saturación de disco ante picos).

  EnableMultiAZ:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Activar réplica síncrona en zona B. Dejar en 'false' en laboratorios para control de costos.

  EnableEnhancedMonitoring:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Habilitar monitoreo detallado de SO en CloudWatch consumiendo el rol exportado de Fase 2.

  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Protección contra eliminación accidental. Dejar en 'false' para facilitar limpieza tras la presentación.

  S3BucketNamePrefix:
    Type: String
    Default: apm-sofi-storage
    Description: Prefijo para el bucket S3 (se le concatenará AccountId y Región para garantizar unicidad global).

  DaysToStandardIA:
    Type: Number
    Default: 60
    Description: Días antes de migrar assets del LMS (videos/PDFs) a S3 Standard-IA (Infrequent Access).

  DaysToGlacier:
    Type: Number
    Default: 90
    Description: Días antes de transferir respaldos (backups/) a S3 Glacier Flexible Retrieval.

  DaysToExpiration:
    Type: Number
    Default: 365
    Description: Días totales tras los cuales los respaldos antiguos en Glacier se eliminan automáticamente.

Conditions:
  IsMultiAZ: !Equals [!Ref EnableMultiAZ, 'true']
  IsEnhancedMonitoringEnabled: !Equals [!Ref EnableEnhancedMonitoring, 'true']
  IsDeletionProtectionEnabled: !Equals [!Ref EnableDeletionProtection, 'true']

Resources:

  # =========================================================================
  # 1. GESTIÓN SEGURA DE CREDENCIALES (AWS Secrets Manager)
  # =========================================================================

  SofiRDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/rds/sofi/credentials"
      Description: !Sub "Credenciales maestras administradas para RDS PostgreSQL - SOFI (${EnvironmentName})"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "sofi_admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '/@" \\'
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sofi-rds-secret"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: SOFI-APM
        - Key: Phase
          Value: Fase-3

  ReflexoRDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/rds/reflexo/credentials"
      Description: !Sub "Credenciales maestras administradas para RDS PostgreSQL - Reflexo Peru (${EnvironmentName})"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "reflexo_admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '/@" \\'
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-reflexo-rds-secret"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ReflexoPeru
        - Key: Phase
          Value: Fase-3

  ArteIdeasRDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/rds/arteideas/credentials"
      Description: !Sub "Credenciales maestras administradas para RDS PostgreSQL - Arte & Ideas (${EnvironmentName})"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "arteideas_admin"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '/@" \\'
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-arteideas-rds-secret"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ArteIdeas
        - Key: Phase
          Value: Fase-3

  # =========================================================================
  # 2. AMAZON RDS POSTGRESQL 16 (Grupo de Parámetros Compartido y 3 Instancias)
  # =========================================================================

  PostgresDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "Grupo de parametros optimizado para PostgreSQL 16 con SSL obligatorio"
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-pg16-parameters"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Phase
          Value: Fase-3

  # --- 2.1 RDS SOFI Platform (sofi_db) ---
  PostgresDBInstanceSofi:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-rds-sofi"
      DBName: sofi_db
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      MasterUsername: sofi_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${SofiRDSSecret}:SecretString:password}}"
      DBSubnetGroupName:
        Fn::ImportValue: !Sub "${EnvironmentName}-RdsDbSubnetGroup"
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsSecurityGroupId"
      DBParameterGroupName: !Ref PostgresDBParameterGroup
      MultiAZ: !Ref EnableMultiAZ
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "Sun:04:30-Sun:05:30"
      StorageEncrypted: true
      DeletionProtection: !If [IsDeletionProtectionEnabled, true, false]
      MonitoringInterval: !If [IsEnhancedMonitoringEnabled, 60, 0]
      MonitoringRoleArn: !If
        - IsEnhancedMonitoringEnabled
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsEnhancedMonitoringRoleArn"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds-sofi"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: SOFI-APM
        - Key: Phase
          Value: Fase-3

  # --- 2.2 RDS Reflexo Perú (reflexo_db) ---
  PostgresDBInstanceReflexo:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-rds-reflexo"
      DBName: reflexo_db
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      MasterUsername: reflexo_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${ReflexoRDSSecret}:SecretString:password}}"
      DBSubnetGroupName:
        Fn::ImportValue: !Sub "${EnvironmentName}-RdsDbSubnetGroup"
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsSecurityGroupId"
      DBParameterGroupName: !Ref PostgresDBParameterGroup
      MultiAZ: !Ref EnableMultiAZ
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "04:00-05:00"
      PreferredMaintenanceWindow: "Sun:05:30-Sun:06:30"
      StorageEncrypted: true
      DeletionProtection: !If [IsDeletionProtectionEnabled, true, false]
      MonitoringInterval: !If [IsEnhancedMonitoringEnabled, 60, 0]
      MonitoringRoleArn: !If
        - IsEnhancedMonitoringEnabled
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsEnhancedMonitoringRoleArn"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds-reflexo"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ReflexoPeru
        - Key: Phase
          Value: Fase-3

  # --- 2.3 RDS Arte & Ideas (arteideas_db) ---
  PostgresDBInstanceArteIdeas:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-rds-arteideas"
      DBName: arteideas_db
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      MasterUsername: arteideas_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${ArteIdeasRDSSecret}:SecretString:password}}"
      DBSubnetGroupName:
        Fn::ImportValue: !Sub "${EnvironmentName}-RdsDbSubnetGroup"
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsSecurityGroupId"
      DBParameterGroupName: !Ref PostgresDBParameterGroup
      MultiAZ: !Ref EnableMultiAZ
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      PreferredBackupWindow: "05:00-06:00"
      PreferredMaintenanceWindow: "Sun:06:30-Sun:07:30"
      StorageEncrypted: true
      DeletionProtection: !If [IsDeletionProtectionEnabled, true, false]
      MonitoringInterval: !If [IsEnhancedMonitoringEnabled, 60, 0]
      MonitoringRoleArn: !If
        - IsEnhancedMonitoringEnabled
        - Fn::ImportValue: !Sub "${EnvironmentName}-RdsEnhancedMonitoringRoleArn"
        - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds-arteideas"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: ArteIdeas
        - Key: Phase
          Value: Fase-3

  # =========================================================================
  # 3. AMAZON S3 & POLÍTICA DE RETENCIÓN S3 GLACIER (Storage Inmutable y Cifrado)
  # =========================================================================

  SofiStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${S3BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: MoveBackupsToGlacierRule
            Status: Enabled
            Prefix: "backups/"
            Transitions:
              - TransitionInDays: !Ref DaysToGlacier
                StorageClass: GLACIER
            ExpirationInDays: !Ref DaysToExpiration
            NoncurrentVersionExpirationInDays: 90
          - Id: OptimizeLMSAssetsRule
            Status: Enabled
            Prefix: "lms-media/"
            Transitions:
              - TransitionInDays: !Ref DaysToStandardIA
                StorageClass: STANDARD_IA
          - Id: CleanIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-s3-storage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: SOFI-APM
        - Key: Phase
          Value: Fase-3

  SofiStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SofiStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SofiStorageBucket.Arn
              - !Sub "${SofiStorageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # =========================================================================
  # 4. AMAZON EFS (Sistema de Archivos Elástico Compartido para Cómputo/Dev)
  # =========================================================================

  SharedFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-efs-shared"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: SOFI-APM
        - Key: Phase
          Value: Fase-3

  EFSMountTargetAppA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref SharedFileSystem
      SubnetId:
        Fn::ImportValue: !Sub "${EnvironmentName}-PrivateAppSubnetA"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-EfsSecurityGroupId"

  EFSMountTargetAppB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref SharedFileSystem
      SubnetId:
        Fn::ImportValue: !Sub "${EnvironmentName}-PrivateAppSubnetB"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-EfsSecurityGroupId"

  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref SharedFileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: "/workspace"
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0755"
      AccessPointTags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-efs-access-point"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: SOFI-APM
        - Key: Phase
          Value: Fase-3

# =========================================================================
# 5. OUTPUTS (Salidas exportadas para Fases 4 y 5)
# =========================================================================

Outputs:

  # --- SOFI Outputs ---
  SofiRDSEndpointAddress:
    Description: "Endpoint DNS de la base de datos PostgreSQL de SOFI"
    Value: !GetAtt PostgresDBInstanceSofi.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-SofiRDSEndpointAddress"

  SofiRDSEndpointPort:
    Description: "Puerto de conexion PostgreSQL de SOFI"
    Value: !GetAtt PostgresDBInstanceSofi.Endpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-SofiRDSEndpointPort"

  SofiRDSSecretArn:
    Description: "ARN del secreto en AWS Secrets Manager con credenciales de SOFI"
    Value: !Ref SofiRDSSecret
    Export:
      Name: !Sub "${EnvironmentName}-SofiRDSSecretArn"

  SofiRDSSecretName:
    Description: "Nombre del secreto de SOFI para Fargate"
    Value: !Sub "${EnvironmentName}/rds/sofi/credentials"
    Export:
      Name: !Sub "${EnvironmentName}-SofiRDSSecretName"

  # Alias de compatibilidad hacia SOFI
  RDSEndpointAddress:
    Description: "Endpoint DNS de la base de datos PostgreSQL principal (SOFI)"
    Value: !GetAtt PostgresDBInstanceSofi.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-RDSEndpointAddress"

  RDSSecretArn:
    Description: "ARN del secreto en AWS Secrets Manager de la base de datos principal"
    Value: !Ref SofiRDSSecret
    Export:
      Name: !Sub "${EnvironmentName}-RDSSecretArn"

  # --- Reflexo Peru Outputs ---
  ReflexoRDSEndpointAddress:
    Description: "Endpoint DNS de la base de datos PostgreSQL de Reflexo Peru"
    Value: !GetAtt PostgresDBInstanceReflexo.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-ReflexoRDSEndpointAddress"

  ReflexoRDSEndpointPort:
    Description: "Puerto de conexion PostgreSQL de Reflexo Peru"
    Value: !GetAtt PostgresDBInstanceReflexo.Endpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-ReflexoRDSEndpointPort"

  ReflexoRDSSecretArn:
    Description: "ARN del secreto en AWS Secrets Manager con credenciales de Reflexo Peru"
    Value: !Ref ReflexoRDSSecret
    Export:
      Name: !Sub "${EnvironmentName}-ReflexoRDSSecretArn"

  ReflexoRDSSecretName:
    Description: "Nombre del secreto de Reflexo Peru para Fargate"
    Value: !Sub "${EnvironmentName}/rds/reflexo/credentials"
    Export:
      Name: !Sub "${EnvironmentName}-ReflexoRDSSecretName"

  # --- Arte & Ideas Outputs ---
  ArteIdeasRDSEndpointAddress:
    Description: "Endpoint DNS de la base de datos PostgreSQL de Arte & Ideas"
    Value: !GetAtt PostgresDBInstanceArteIdeas.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-ArteIdeasRDSEndpointAddress"

  ArteIdeasRDSEndpointPort:
    Description: "Puerto de conexion PostgreSQL de Arte & Ideas"
    Value: !GetAtt PostgresDBInstanceArteIdeas.Endpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-ArteIdeasRDSEndpointPort"

  ArteIdeasRDSSecretArn:
    Description: "ARN del secreto en AWS Secrets Manager con credenciales de Arte & Ideas"
    Value: !Ref ArteIdeasRDSSecret
    Export:
      Name: !Sub "${EnvironmentName}-ArteIdeasRDSSecretArn"

  ArteIdeasRDSSecretName:
    Description: "Nombre del secreto de Arte & Ideas para Fargate"
    Value: !Sub "${EnvironmentName}/rds/arteideas/credentials"
    Export:
      Name: !Sub "${EnvironmentName}-ArteIdeasRDSSecretName"

  # --- Storage & Filesystem Outputs ---
  S3BucketName:
    Description: "Nombre unico global del bucket S3 para almacenamiento y LMS"
    Value: !Ref SofiStorageBucket
    Export:
      Name: !Sub "${EnvironmentName}-S3BucketName"

  S3BucketArn:
    Description: "ARN del bucket S3 para politicas IAM de ECS y EC2"
    Value: !GetAtt SofiStorageBucket.Arn
    Export:
      Name: !Sub "${EnvironmentName}-S3BucketArn"

  EFSFileSystemId:
    Description: "ID del sistema de archivos Amazon EFS para montaje en EC2 y ECS"
    Value: !Ref SharedFileSystem
    Export:
      Name: !Sub "${EnvironmentName}-EFSFileSystemId"

  EFSAccessPointId:
    Description: "ID del Access Point de EFS (/workspace) para contenedores y workstations"
    Value: !Ref EFSAccessPoint
    Export:
      Name: !Sub "${EnvironmentName}-EFSAccessPointId"
