<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesta Cloud AWS | APM Inversiones - Etapa 1</title>
  
  <!-- Reveal.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/white.min.css" id="theme">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #fef8df;
      --r-background-color: #fef8df;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.95);
      --aws-navy: #232f3e;
      --aws-orange: #ff9900;
      --aws-blue: #0073bb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    html, body, .reveal-viewport {
      background-color: var(--bg-base) !important;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      margin: 0;
    }

    /* Resplandores ambientales difuminados (fondo con calidez y profundidad) */
    body::before {
      content: '';
      position: fixed;
      top: 15%;
      left: 35%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: 10%;
      right: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(251, 227, 127, 0.2) 0%, rgba(251, 227, 127, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Fondo animado de nubes con transición suave de desenfoque */
    #cloud-network-bg {
      position: fixed;
      top: -16px;
      left: -16px;
      width: calc(100vw + 32px);
      height: calc(100vh + 32px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.92;
      filter: blur(2.1px);
      transition: filter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Estilos fluidos con rebote elástico y desaceleración suave para fragmentos nativos */
    .reveal .slides section .fragment.fade-up {
      transform: translate3d(0, 52px, 0);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.75s ease-out,
                  transform 1.05s cubic-bezier(0.34, 1.45, 0.65, 1) !important;
    }

    .reveal .slides section .fragment.fade-up.visible {
      transform: translate3d(0, 0, 0);
      opacity: 1;
      visibility: inherit;
    }

    @keyframes pulseDash {
      to {
        stroke-dashoffset: -28;
      }
    }

    .data-stream-line {
      animation: pulseDash 5.5s linear infinite;
    }

    .reveal {
      z-index: 1;
      background: transparent !important;
    }

    .reveal .slides {
      text-align: left;
    }

    .reveal .slides section {
      padding: 20px 30px;
    }

    /* Contenedores y Tarjetas Glassmorphism */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 12px 35px -8px rgba(15, 23, 42, 0.07), 0 2px 8px -2px rgba(15, 23, 42, 0.04);
      padding: 28px;
      transition: all 0.25s ease;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px -10px rgba(15, 23, 42, 0.1);
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(255, 153, 0, 0.12);
      color: #b45309;
      border: 1px solid rgba(255, 153, 0, 0.28);
    }

    .pill-badge.navy {
      background: rgba(35, 47, 62, 0.08);
      color: var(--aws-navy);
      border-color: rgba(35, 47, 62, 0.2);
    }

    .pill-badge.danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .pill-badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.25);
    }

    h1, h2, h3, h4 {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 800 !important;
      color: var(--text-main) !important;
      letter-spacing: -0.03em !important;
      text-transform: none !important;
    }

    .slide-title {
      font-size: 2.3rem !important;
      margin-bottom: 6px !important;
      line-height: 1.15 !important;
    }

    .slide-subtitle {
      font-size: 1.05rem !important;
      color: var(--text-muted) !important;
      font-weight: 500 !important;
      margin-bottom: 24px !important;
    }

    /* Grillas y Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .metric-value {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      margin: 8px 0 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .metric-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .icon-box.orange { background: #fff7ed; color: var(--aws-orange); }
    .icon-box.blue { background: #eff6ff; color: var(--aws-blue); }
    .icon-box.red { background: #fef2f2; color: var(--danger); }
    .icon-box.emerald { background: #ecfdf5; color: var(--success); }

    /* Indicador de progreso de reveal */
    .reveal .progress {
      color: var(--aws-orange);
      height: 4px;
    }

    .reveal .controls button {
      color: var(--aws-navy) !important;
    }

    /* Top bar fija */
    .header-bar {
      position: fixed;
      top: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .header-bar .logo-tag {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--aws-navy);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body>

  <!-- Barra de cabecera fija -->
  <div class="header-bar">
    <div class="logo-tag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
      <span>APM INVERSIONES <strong>· AWS CLOUD</strong></span>
    </div>
    <div class="pill-badge navy">Semana 6 · Etapa 1</div>
  </div>

  <!-- Fondo animado e interconectado de Nubes con logo AWS e iconos oficiales -->
  <svg id="cloud-network-bg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradientes y Filtros -->
      <linearGradient id="networkLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569" stop-opacity="0.85"/>
        <stop offset="50%" stop-color="#334155" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#475569" stop-opacity="0.85"/>
      </linearGradient>
      <linearGradient id="cloudCenterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fafc"/>
      </linearGradient>
      <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="20" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
      <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.06"/>
      </filter>
      <filter id="packetGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 1. Red Unificada de Conexiones (Radiales, Perimétricas y Cruzadas) -->
    <!-- Color sólido #64748b homogéneo en toda la red para evitar que desaparezcan líneas verticales u horizontales en SVG -->
    <g stroke="#64748b" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="6,8" stroke-linecap="round" class="data-stream-line" fill="none">
      <!-- Conectores Radiales hacia la Nube Central AWS (800, 500) -->
      <path d="M 300 240 L 800 500" />
      <path d="M 800 140 L 800 500" />
      <path d="M 1300 240 L 800 500" />
      <path d="M 1320 760 L 800 500" />
      <path d="M 800 860 L 800 500" />
      <path d="M 280 760 L 800 500" />

      <!-- Anillo Perimétrico Exterior entre Nubes Adyacentes -->
      <path d="M 300 240 L 800 140" />
      <path d="M 800 140 L 1300 240" />
      <path d="M 1300 240 L 1320 760" />
      <path d="M 1320 760 L 800 860" />
      <path d="M 800 860 L 280 760" />
      <path d="M 280 760 L 300 240" />

      <!-- Conectores Cruzados de Malla Completa -->
      <path d="M 300 240 L 1300 240" />
      <path d="M 280 760 L 1320 760" />
      <path d="M 800 140 L 800 860" />
      <path d="M 300 240 L 1320 760" />
      <path d="M 280 760 L 1300 240" />
    </g>

    <!-- 2. Transferencia Sutil y Calmada de Datos (reducida a 10 puntos pausados) -->
    <!-- Flujos Radiales (Nubes periféricas hacia AWS Central) -->
    <circle r="3.5" fill="#ff9900" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 300 240 L 800 500" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#6366f1" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 800 140 L 800 500" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#3b82f6" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 1300 240 L 800 500" dur="5.0s" begin="1.6s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#ef4444" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 1320 760 L 800 500" dur="4.8s" begin="2.4s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#f43f5e" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 800 860 L 800 500" dur="4.5s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#10b981" opacity="0.85" filter="url(#packetGlow)">
      <animateMotion path="M 280 760 L 800 500" dur="5.2s" begin="2.0s" repeatCount="indefinite" />
    </circle>

    <!-- Flujos Perimétricos Sutiles (Intercambio suave entre servicios) -->
    <circle r="3" fill="#ff9900" opacity="0.75" filter="url(#packetGlow)">
      <animateMotion path="M 300 240 L 800 140" dur="5.6s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#6366f1" opacity="0.75" filter="url(#packetGlow)">
      <animateMotion path="M 800 140 L 1300 240" dur="5.8s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#ef4444" opacity="0.75" filter="url(#packetGlow)">
      <animateMotion path="M 1320 760 L 800 860" dur="5.5s" begin="2.6s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#10b981" opacity="0.75" filter="url(#packetGlow)">
      <animateMotion path="M 280 760 L 300 240" dur="5.8s" begin="1.0s" repeatCount="indefinite" />
    </circle>

    <!-- 4. Nubes Periféricas con ICONOS VECTORIALES DE AWS AMPLIADOS -->
    
    <!-- Nube 1: Cómputo (EC2) -->
    <g transform="translate(300, 240) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS EC2 / Cómputo Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#ff9900" fill-opacity="0.16" stroke="#ff9900" stroke-width="2"/>
        <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#ff9900"/>
        <line x1="-5" y1="-13" x2="-5" y2="-9" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="5" y1="-13" x2="5" y2="-9" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-5" y1="9" x2="-5" y2="13" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="5" y1="9" x2="5" y2="13" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-13" y1="-5" x2="-9" y2="-5" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-13" y1="5" x2="-9" y2="5" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="9" y1="-5" x2="13" y2="-5" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="9" y1="5" x2="13" y2="5" stroke="#ff9900" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Nube 2: Redes (VPC / Route 53) -->
    <g transform="translate(800, 140) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS Redes / VPC Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#6366f1" fill-opacity="0.16" stroke="#6366f1" stroke-width="2"/>
        <circle cx="0" cy="0" r="9" fill="none" stroke="#6366f1" stroke-width="2"/>
        <line x1="-9" y1="0" x2="9" y2="0" stroke="#6366f1" stroke-width="1.6"/>
        <ellipse cx="0" cy="0" rx="4" ry="9" fill="none" stroke="#6366f1" stroke-width="1.6"/>
      </g>
    </g>

    <!-- Nube 3: Base de Datos (RDS) -->
    <g transform="translate(1300, 240) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS RDS Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#3b48cc" fill-opacity="0.16" stroke="#3b48cc" stroke-width="2"/>
        <ellipse cx="0" cy="-5" rx="9" ry="3.2" fill="#3b48cc"/>
        <path d="M -9 -5 L -9 1 A 9 3.2 0 0 0 9 1 L 9 -5 Z" fill="#3b48cc" fill-opacity="0.75"/>
        <path d="M -9 1 L -9 7 A 9 3.2 0 0 0 9 7 L 9 1 Z" fill="#3b48cc"/>
      </g>
    </g>

    <!-- Nube 4: Seguridad (IAM) -->
    <g transform="translate(1320, 760) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS IAM / Seguridad Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-width="2"/>
        <path d="M 0 -9.5 L 8.5 -5.8 L 8.5 0.5 C 8.5 5.8 4.8 9 0 11.2 C -4.8 9 -8.5 5.8 -8.5 0.5 L -8.5 -5.8 Z" fill="#ef4444"/>
        <circle cx="0" cy="-0.5" r="2" fill="#ffffff"/>
        <path d="M -1.2 0.5 L 1.2 0.5 L 1.4 4 L -1.4 4 Z" fill="#ffffff"/>
      </g>
    </g>

    <!-- Nube 5: Operaciones y Monitoreo (CloudWatch) -->
    <g transform="translate(800, 860) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS CloudWatch Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-width="2"/>
        <polyline points="-10,1 -6,1 -3,-5 0,6 3,-3 6,1 10,1" fill="none" stroke="#f43f5e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Nube 6: Almacenamiento (S3) -->
    <g transform="translate(280, 760) scale(1.4)" filter="url(#cloudShadow)">
      <path d="M -65 -18 A 38 38 0 0 1 -18 -50 A 46 46 0 0 1 42 -36 A 32 32 0 0 1 70 5 A 36 36 0 0 1 32 50 L -42 50 A 40 40 0 0 1 -65 -18 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
      <!-- Icono AWS S3 Ampliado -->
      <g transform="translate(0, 2) scale(1.4)">
        <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-width="2"/>
        <path d="M -9.5 -7.5 L 9.5 -7.5 L 8 7.5 L -8 7.5 Z" fill="#10b981"/>
        <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="-6" y1="2.8" x2="6" y2="2.8" stroke="#ffffff" stroke-width="1.8"/>
      </g>
    </g>

    <!-- 5. NUBE CENTRAL CON LOGO OFICIAL Y NÍTIDO DE AWS (AMPLIADA) -->
    <g transform="translate(800, 500) scale(1.25)" filter="url(#softGlow)">
      <!-- Silueta de Nube Central -->
      <path d="M -135 -30 A 75 75 0 0 1 -40 -95 A 95 95 0 0 1 85 -70 A 70 70 0 0 1 145 10 A 80 80 0 0 1 65 100 L -80 100 A 85 85 0 0 1 -135 -30 Z" 
            fill="url(#cloudCenterGrad)" stroke="#ff9900" stroke-width="3.5" stroke-opacity="0.85"/>
      
      <!-- LOGO AWS OFICIAL: Texto nítido 'aws' y sonrisa naranja -->
      <g transform="translate(0, -6)">
        <text x="0" y="8" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="58" fill="#232f3e" letter-spacing="-2px">aws</text>
        <!-- Sonrisa / Flecha Oficial AWS -->
        <path d="M -48 24 Q 0 47 48 24" fill="none" stroke="#ff9900" stroke-width="5.5" stroke-linecap="round"/>
        <polygon points="42,16 54,24 44,32" fill="#ff9900"/>
      </g>
    </g>
  </svg>

  <!-- Presentación Reveal.js -->
  <div class="reveal">
    <div class="slides">
      <!-- {{SLIDES}} -->

    </div>
  </div>

  <!-- Reveal.js Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      controls: true,
      progress: true,
      center: true,
      transition: 'slide',
      transitionSpeed: 'default',
      backgroundTransition: 'fade',
      margin: 0.08,
      width: 1200,
      height: 700
    });

    // Sincronización del fondo reactivo y blur con los Fragmentos de Reveal.js
    const bg = document.getElementById('cloud-network-bg');

    function syncBackgroundBlur() {
      if (!bg) return;
      const indices = Reveal.getIndices();
      const isFirstSlide = (indices.h === 0 && (indices.v === 0 || indices.v === undefined));

      if (isFirstSlide) {
        const slide1 = document.querySelector('.slide-portada');
        const visibleFragments = slide1 ? slide1.querySelectorAll('.fragment.visible') : [];
        if (visibleFragments.length === 0) {
          bg.style.transition = 'filter 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
          bg.style.filter = 'blur(0px)';
        } else {
          bg.style.transition = 'filter 1.1s cubic-bezier(0.16, 1, 0.3, 1)';
          bg.style.filter = 'blur(2.1px)';
        }
      } else {
        bg.style.transition = 'none';
        bg.style.filter = 'blur(2.1px)';
      }
    }

    Reveal.on('ready', syncBackgroundBlur);
    Reveal.on('slidechanged', syncBackgroundBlur);
